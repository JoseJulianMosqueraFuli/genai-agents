services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app

  test-api:
    build: .
    env_file:
      - .env
    command: pytest tests/ -v
    volumes:
      - ./tests:/app/tests
      - ./app:/app/app
