services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app

  test-api:
    build: .
    env_file:
      - .env
    # The runtime image is installed with --no-dev, so pull in the dev group
    # (pytest, httpx) from the lockfile before running the suite.
    command: sh -c "uv sync --frozen && uv run pytest tests/ -v"
    volumes:
      - ./tests:/app/tests
      - ./app:/app/app
